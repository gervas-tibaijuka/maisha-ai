<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Signup - Maisha AI</title>
    <style>
        body{
            background:#0d0f12;
            color:white;
            font-family:sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            width:320px;
            padding:20px;
            background:#181b21;
            border-radius:12px;
            border:1px solid #2a2f3a;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
            border-radius:8px;
            border:none;
            outline:none;
        }

        button{
            width:100%;
            padding:10px;
            background:#22c55e;
            border:none;
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

        a{color:#4f8ef7}
    </style>
</head>
<body>

<div class="box">
    <h2>Sajili - Maisha AI</h2>

    <form method="POST">
        <input name="username" placeholder="Username" required>
        <input name="password" type="password" placeholder="Password" required>
        <button type="submit">Create Account</button>
    </form>

    <p>Tayari una account? <a href="/login">Ingia</a></p>
</div>

</body>
</html>
