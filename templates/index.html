<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maisha AI - Dashboard</title>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Markdown and Prism Highlight JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    
    <style>
        :root {
            --bg-main: #343541;
            --bg-sidebar: #202123;
            --bg-chat-user: #343541;
            --bg-chat-ai: #444654;
            --text-main: #ececf1;
            --text-muted: #8e8ea0;
            --accent-green: #10a37f;
            --border-color: #4d4d4f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            display: flex;
        }

        /* --- SIDEBAR TOGGLE BUTTON --- */
        .sidebar-toggle-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: var(--bg-sidebar);
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-toggle-btn:hover {
            background: #353740;
        }

        /* --- SIDEBAR OVERLAY --- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* --- COLLAPSIBLE SIDEBAR --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background-color: var(--bg-sidebar);
            color: #fff;
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar.open ~ .sidebar-overlay {
            display: block;
            opacity: 1;
        }

        .sidebar-header {
            padding: 15px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            flex: 1;
            background: transparent;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #2a2b32;
        }

        .close-sidebar-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 5px 10px;
        }

        /* Conversations Container */
        .conversations-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 15px 10px;
        }

        .sidebar-section-title {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .conv-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 5px;
            font-size: 13px;
            transition: background 0.2s;
            color: #ececf1;
        }

        .conv-item:hover, .conv-item.active {
            background: #2a2b32;
        }

        .conv-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .conv-actions i {
            color: var(--text-muted);
            margin-left: 8px;
            cursor: pointer;
        }

        .conv-actions i:hover {
            color: #fff;
        }

        /* Sidebar Footer Account section */
        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding: 15px;
            background: #171719;
        }

        .user-account-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-avatar i {
            font-size: 32px;
            color: var(--accent-green);
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .username-text {
            font-weight: bold;
            font-size: 14px;
            color: #ececf1;
        }

        .user-status {
            font-size: 11px;
            color: var(--accent-green);
        }

        .footer-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .footer-action-btn {
            background: transparent;
            border: none;
            color: #ececf1;
            text-align: left;
            padding: 8px 10px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .footer-action-btn:hover {
            background: #2a2b32;
        }

        .text-danger {
            color: #ff4d4d !important;
        }

        /* --- MAIN CHAT CONTAINER --- */
        .main-container {
            flex: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-main);
            padding-top: 60px; /* Nafasi ya Hamburger button */
        }

        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
        }

        /* Chat Rows Framework */
        .chat-row {
            padding: 24px 15%;
            display: flex;
            gap: 20px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .chat-row.user {
            background-color: var(--bg-main);
        }

        .chat-row.ai {
            background-color: var(--bg-chat-ai);
        }

        .avatar-box {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .chat-row.user .avatar-box {
            background-color: #5436da;
            color: white;
        }

        .chat-row.ai .avatar-box {
            background-color: var(--accent-green);
            color: white;
        }

        .message-content {
            flex: 1;
            color: var(--text-main);
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
        }

        /* Markdown Styling inside responses */
        .message-content p { margin-bottom: 12px; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content strong { color: #fff; }
        .message-content ul, .message-content ol { margin-left: 20px; margin-bottom: 12px; }
        .message-content table { border-collapse: collapse; width: 100%; margin: 15px 0; }
        .message-content th, .message-content td { border: 1px solid var(--border-color); padding: 8px 12px; text-align: left; }
        .message-content th { background-color: rgba(255,255,255,0.05); }

        /* Welcome Screen Layout */
        .welcome-container {
            text-align: center;
            max-width: 500px;
            margin: 100px auto 0 auto;
            padding: 20px;
        }

        /* Input Controls Area at bottom */
        .input-container-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, var(--bg-main) 30%);
            padding: 20px 15% 30px 15%;
        }

        .input-bar-box {
            background-color: #40414f;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: flex-end;
            padding: 10px 14px;
            position: relative;
        }

        .input-bar-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 15px;
            resize: none;
            max-height: 140px;
            row-gap: 0;
            line-height: 1.5;
            padding-right: 40px;
        }

        .send-message-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .send-message-btn:not(:disabled) {
            color: var(--accent-green);
        }

        .send-message-btn:disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }

        /* Responsive on mobile screens */
        @media (max-width: 768px) {
            .chat-row { padding: 20px 5%; }
            .input-container-wrapper { padding: 10px 5% 20px 5%; }
        }
    </style>
</head>
<body>

    <!-- Kitufe cha Hamburger Juu Kushoto -->
    <button id="sidebarToggle" class="sidebar-toggle-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar Overlay Shadow -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Collapsible Sidebar Content Area -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="createNewConversationFromUI()">
                <i class="fas fa-plus"></i> Soga Mpya
            </button>
            <button class="close-sidebar-btn" onclick="toggleSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="conversations-wrapper" id="conversationsContainer">
            <div class="sidebar-section-title">Historia ya Soga</div>
            <div id="conversationsList">
                <!-- Data zitajazwa kiotomatiki hapa kutoka DB -->
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="user-account-box">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-info">
                    <!-- Hapa linaandikwa jina kamili la mtu aliyesajili akaunti -->
                    <span class="username-text" id="currentUserBox">{{ username }}</span>
                    <span class="user-status">Akaunti Amilifu</span>
                </div>
            </div>
            
            <div class="footer-actions">
                <button class="footer-action-btn text-danger" onclick="clearAllConversationsFromUI()">
                    <i class="fas fa-trash-alt"></i> Futa Soga Zote
                </button>
                <a href="/logout" class="footer-action-btn logout-link">
                    <i class="fas fa-sign-out-alt"></i> Ondoka (Logout)
                </a>
            </div>
        </div>
    </aside>

    <!-- Main Chat Content Section Container -->
    <main class="main-container">
        <div class="chat-window" id="chatWindow">
            <!-- Screen ya kwanza kabisa kabla mtu hajaandika -->
            <div class="welcome-container" id="welcomeBox">
                <i class="fas fa-comments" style="font-size: 54px; color: var(--accent-green); margin-bottom:20px; display:block;"></i>
                <h3>Mambo vipi, {{ username }}! Naitwa Maisha AI.</h3>
                <p style="color: var(--text-muted); margin-top: 10px; font-size:14px;">
                    Nikupe ushauri gani leo? Tunaweza kuongea kuhusu masomo, CV, kutafuta pesa au mambo ya mahusiano bila hukumu yoyote!
                </p>
            </div>
        </div>

        <!-- Input Section Container Area -->
        <div class="input-container-wrapper">
            <div class="input-bar-box">
                <textarea id="userInput" rows="1" placeholder="Andika ujumbe wako hapa..." onkeydown="handleInputKeys(event)"></textarea>
                <button id="sendBtn" class="send-message-btn" onclick="dispatchUserMessage()" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- --- JAVASCRIPT LOGIC MOTOR ENGINE --- -->
    <script>
        // Mfumo wa kuhifadhi Hali ya sasa ya Programu
        const state = {
            currentConversationId: null,
            isGenerating: false
        };

        // App Initialization Trigger
        document.addEventListener("DOMContentLoaded", () => {
            fetchConversationsFromDatabase();
            
            // Kusikiliza mabadiliko ya maandishi kwenye Textarea ili kuwasha kitufe
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            
            userInput.addEventListener('input', () => {
                sendBtn.disabled = userInput.value.trim() === '' || state.isGenerating;
                
                // Kunyoosha textbox kwenda juu kulingana na urefu wa ujumbe
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
            });

            // Sanidi marked.js kwa ajili ya Markdown styling
            marked.setOptions({ breaks: true });
        });

        // Kufungua au Kufunga Sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
            } else {
                sidebar.classList.add('open');
            }
        }

        // Kupakia historia yote ya soga kutoka kwenye DB
        function fetchConversationsFromDatabase() {
            fetch('/api/conversations')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('conversationsList');
                    list.innerHTML = '';
                    
                    if(data.length === 0) {
                        list.innerHTML = `<div style="color:var(--text-muted); font-size:12px; padding:10px;">Huna soga yoyote mzee</div>`;
                        return;
                    }

                    data.forEach(conv => {
                        const activeClass = state.currentConversationId == conv.id ? 'active' : '';
                        const div = document.createElement('div');
                        div.className = `conv-item ${activeClass}`;
                        div.setAttribute('id', `conv-${conv.id}`);
                        div.onclick = () => selectConversation(conv.id);
                        
                        div.innerHTML = `
                            <div class="conv-title-box">
                                <i class="far fa-comment-alt"></i>
                                <span>${conv.title}</span>
                            </div>
                            <div class="conv-actions">
                                <i class="fas fa-trash-alt" onclick="deleteConversationEvent(event, ${conv.id})"></i>
                            </div>
                        `;
                        list.appendChild(div);
                    });
                })
                .catch(err => console.error("Error fetching conversations:", err));
        }

        // Kuchagua soga fulani na kuipakia kwenye kioo cha chat
        function selectConversation(convId) {
            state.currentConversationId = convId;
            
            // Weka alama ya active kwenye sidebar item
            document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
            const selectedEl = document.getElementById(`conv-${convId}`);
            if(selectedEl) selectedEl.classList.add('active');

            // Funga sidebar kama yupo kwenye simu
            if (window.innerWidth < 768) toggleSidebar();

            fetch(`/api/conversations/${convId}`)
                .then(res => res.json())
                .then(data => {
                    const chatWindow = document.getElementById('chatWindow');
                    chatWindow.innerHTML = ''; // Safisha skrini
                    
                    if (data.messages.length === 0) {
                        chatWindow.innerHTML = `
                            <div class="welcome-container">
                                <i class="fas fa-comments" style="font-size: 48px; color: var(--accent-green); margin-bottom:15px;"></i>
                                <h3>Soga ipo wazi!</h3>
                                <p style="color:var(--text-muted);">Andika chochote uanze kuongea na Maisha AI.</p>
                            </div>`;
                        return;
                    }

                    data.messages.forEach(msg => {
                        renderMessageRow(msg.sender, msg.text);
                    });
                    
                    scrollToBottom();
                });
        }

        // Kutengeneza Soga Mpya (ChatGPT Style bila kurefresh)
        function createNewConversationFromUI() {
            state.isGenerating = false;
            document.getElementById('userInput').value = '';
            document.getElementById('userInput').style.height = 'auto';
            document.getElementById('sendBtn').disabled = true;

            fetch('/api/conversations/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: 'Mazungumzo Mapya' })
            })
            .then(res => res.json())
            .then(newConv => {
                state.currentConversationId = newConv.id;
                
                // Safisha kioo kiwe tayari
                document.getElementById('chatWindow').innerHTML = `
                    <div class="welcome-container">
                        <i class="fas fa-comments" style="font-size: 54px; color: var(--accent-green); margin-bottom:20px; display:block;"></i>
                        <h3>Mambo vipi tena! Tuanzishe soga mpya.</h3>
                        <p style="color: var(--text-muted); font-size:14px;">Nishushe nondo gani sasa hivi?</p>
                    </div>`;
                
                fetchConversationsFromDatabase();
                if (window.innerWidth < 768) toggleSidebar();
                document.getElementById('userInput').focus();
            });
        }

        // Kusimamia vitufe vya Enter kuandika ujumbe
        function handleInputKeys(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); // Zuia kushuka mstari mpya
                if (!state.isGenerating && document.getElementById('userInput').value.trim() !== '') {
                    dispatchUserMessage();
                }
            }
        }

        // KUTUMA UJUMBE NA KU-STREAM MAJIBU YA GROQ NENO KWA NENO
        async function dispatchUserMessage() {
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const messageText = userInput.value.trim();

            if (!messageText || state.isGenerating) return;

            // 1. Kama hakuna soga iliyofunguliwa sasa hivi, itengeneze kwanza yenyewe kiotomatiki
            if (!state.currentConversationId) {
                await fetch('/api/conversations/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: messageText.substring(0, 25) + '...' })
                })
                .then(res => res.json())
                .then(newConv => {
                    state.currentConversationId = newConv.id;
                });
            }

            // Washa ulinzi wa maongezi (Lock states)
            state.isGenerating = true;
            sendBtn.disabled = true;

            // Safisha eneo la karibu na uondoe Welcome box kama lipo
            const welcomeBox = document.getElementById('welcomeBox');
            if(welcomeBox) welcomeBox.remove();

            // 2. Render ujumbe wa user kwenye Screen mara moja
            renderMessageRow('user', messageText);
            userInput.value = '';
            userInput.style.height = 'auto';
            scrollToBottom();

            // 3. Andaa kitalu (Row) maalum kitakachopokea majibu ya AI yanayokuja kwa mtiririko
            const aiRowId = 'ai-stream-' + Date.now();
            renderMessageRow('ai', '', aiRowId);
            const aiContentContainer = document.querySelector(`#${aiRowId} .message-content`);

            try {
                // Piga simu ya HTTP Stream kwenda Flask Engine yetu mpya
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: messageText,
                        conversation_id: state.currentConversationId
                    })
                });

                if (!response.ok) throw new Error("Mawasiliano na seva yamefeli");

                // Fungua usomaji wa vijisehemu vya text (Tokens reader)
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let accumulatedText = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    // Badilisha byte kuwa neno la kawaida
                    const chunk = decoder.decode(value, { stream: true });
                    accumulatedText += chunk;

                    // Geuza maandishi ya sasa kuwa HTML safi ya kuvutia kupitia marked.js
                    aiContentContainer.innerHTML = marked.parse(accumulatedText);
                    
                    // Highlighting code blocks kama vipo
                    aiContentContainer.querySelectorAll('pre code').forEach((block) => {
                        Prism.highlightElement(block);
                    });

                    scrollToBottom();
                }

            } catch (err) {
                console.error("Streaming error:", err);
                aiContentContainer.innerHTML = `<span style="color:var(--text-danger);">[Hitilafu]: Mfumo umeshindwa kupokea mawasiliano ya AI. Jaribu tena!</span>`;
            } finally {
                // Fungua ulinzi (Unlock parameters)
                state.isGenerating = false;
                sendBtn.disabled = userInput.value.trim() === '';
                fetchConversationsFromDatabase(); // Pakia upya majina ya sidebar kama kichwa cha habari kikibadilika
            }
        }

        // Kujenga Mistari ya Maongezi kwenye Screen (HTML Injector)
        function renderMessageRow(sender, text, optionalId = '') {
            const chatWindow = document.getElementById('chatWindow');
            const row = document.createElement('div');
            row.className = `chat-row ${sender}`;
            if(optionalId) row.setAttribute('id', optionalId);

            const avatarText = sender === 'user' ? 'U' : 'AI';
            const parsedContent = text ? marked.parse(text) : '<span class="loading-cursor">...</span>';

            row.innerHTML = `
                <div class="avatar-box">${avatarText}</div>
                <div class="message-content">${parsedContent}</div>
            `;
            chatWindow.appendChild(row);
            
            // Kujaza rangi za codes kama zimo kwenye kumbukumbu
            if(text) {
                row.querySelectorAll('pre code').forEach(block => Prism.highlightElement(block));
            }
        }

        // Kusukuma screen kwenda chini kila neno jipya linapoongezeka
        function scrollToBottom() {
            const chatWindow = document.getElementById('chatWindow');
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Kufuta soga moja mahususi
        function deleteConversationEvent(e, convId) {
            e.stopPropagation(); // Zuia isifungue soga wakati wa kufuta
            if(!confirm("Una uhakika unataka kufuta maongezi haya?")) return;

            fetch(`/api/conversations/delete/${convId}`, { method: 'DELETE' })
                .then(() => {
                    if(state.currentConversationId === convId) {
                        state.currentConversationId = null;
                        document.getElementById('chatWindow').innerHTML = `
                            <div class="welcome-container">
                                <h3>Soga imefutwa!</h3>
                                <p style="color:var(--text-muted)">Anzisha soga mpya juu kushoto.</p>
                            </div>`;
                    }
                    fetchConversationsFromDatabase();
                });
        }

        // Kufuta soga zote kabisa za mtumiaji
        function clearAllConversationsFromUI() {
            if(!confirm("Je, una uhakika unataka kufuta historia yako yote ya soga? Kitendo hiki hakirudi nyuma!")) return;

            fetch('/api/conversations/clear_all', { method: 'POST' })
                .then(() => {
                    state.currentConversationId = null;
                    document.getElementById('chatWindow').innerHTML = `
                        <div class="welcome-container">
                            <h3>Historia Imesafishwa!</h3>
                            <p style="color:var(--text-muted)">Ukurasa wako upo msafi sasa hivi.</p>
                        </div>`;
                    fetchConversationsFromDatabase();
                    if (window.innerWidth < 768) toggleSidebar();
                });
        }
    </script>
</body>
</html>
