<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maisha AI</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#0d0f12;
    --surface:#181b21;
    --surface2:#1f232b;
    --border:#2a2e3a;
    --accent:#4f8ef7;
    --text:#eef2ff;
    --muted:#9aa2b8;
    --radius:18px;
}

body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

/* SCREEN */
.screen{
    display:none;
    height:100vh;
}

.screen.active{
    display:flex;
}

/* LOGIN */
#loginScreen{
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0a0f1e,#0c1222);
}

.login-card{
    width:100%;
    max-width:420px;
    background:#111318;
    border:1px solid rgba(79,142,247,.2);
    border-radius:32px;
    padding:32px;
}

.logo{
    text-align:center;
    margin-bottom:24px;
}

.logo-icon{
    width:60px;
    height:60px;
    background:linear-gradient(135deg,#4f8ef7,#7c5ff5);
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:30px;
    margin-bottom:12px;
}

input{
    width:100%;
    background:#0a0c12;
    border:1px solid #2a2f3f;
    color:white;
    padding:14px;
    border-radius:20px;
    margin-bottom:14px;
}

button{
    border:none;
    cursor:pointer;
}

.login-btn{
    width:100%;
    padding:14px;
    border-radius:20px;
    background:var(--accent);
    color:white;
    font-weight:bold;
}

/* CHAT */
#chatScreen{
    flex-direction:column;
}

.topbar{
    height:60px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 20px;
}

.topbar h2{
    font-size:18px;
}

.topbar-right{
    margin-left:auto;
    display:flex;
    gap:10px;
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:12px;
    background:var(--surface);
    color:white;
}

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.welcome{
    text-align:center;
    margin-top:80px;
}

.message{
    margin-bottom:16px;
}

.message.user{
    text-align:right;
}

.bubble{
    display:inline-block;
    padding:14px 18px;
    border-radius:18px;
    max-width:70%;
}

.user .bubble{
    background:#1a3a6b;
}

.ai .bubble{
    background:var(--surface);
}

.input-zone{
    padding:20px;
    border-top:1px solid var(--border);
}

.input-box{
    display:flex;
    gap:10px;
    background:var(--surface);
    border-radius:20px;
    padding:10px;
}

textarea{
    flex:1;
    background:none;
    border:none;
    resize:none;
    color:white;
    outline:none;
}

.send-btn{
    width:50px;
    border-radius:16px;
    background:var(--accent);
    color:white;
}

/* ACCOUNT */
#accountScreen{
    justify-content:center;
    align-items:center;
}

.card{
    width:100%;
    max-width:450px;
    background:#111318;
    border:1px solid var(--border);
    border-radius:28px;
    padding:30px;
}

.card h2{
    margin-bottom:20px;
}

.account-btn{
    width:100%;
    padding:14px;
    border-radius:20px;
    margin-top:10px;
}

.primary{
    background:var(--accent);
    color:white;
}

.secondary{
    background:#2d2f3a;
    color:white;
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginScreen" class="screen active">
    <div class="login-card">
        <div class="logo">
            <div class="logo-icon">🧠</div>
            <h1>Maisha AI</h1>
            <p>Mshauri wako wa kazi</p>
        </div>

        <input type="text" id="username" placeholder="Jina la mtumiaji">
        <input type="password" id="password" placeholder="Nenosiri">

        <button class="login-btn" onclick="login()">
            Ingia
        </button>
    </div>
</section>

<!-- CHAT -->
<section id="chatScreen" class="screen">
    <div class="topbar">
        <h2>🧠 Maisha AI</h2>

        <div class="topbar-right">
            <button class="icon-btn" onclick="shareChat()">📤</button>
            <button class="icon-btn" onclick="openAccount()">⚙️</button>
        </div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="welcome">
            <h1>Karibu Maisha AI</h1>
            <p>Niambie chochote...</p>
        </div>
    </div>

    <div class="input-zone">
        <div class="input-box">
            <textarea id="userInput"
            placeholder="Andika ujumbe..."></textarea>

            <button class="send-btn"
            onclick="sendMessage()">➤</button>
        </div>
    </div>
</section>

<!-- ACCOUNT -->
<section id="accountScreen" class="screen">
    <div class="card">
        <h2>👤 Akaunti yangu</h2>

        <p><strong>Jina:</strong>
            <span id="accountName">
                Mtumiaji
            </span>
        </p>

        <hr style="margin:20px 0;border-color:#2a2e3a">

        <h3>🔐 Badilisha nenosiri</h3>

        <input type="password"
        id="newPassword"
        placeholder="Nenosiri jipya">

        <button class="account-btn primary"
        onclick="changePassword()">
            Badilisha nenosiri
        </button>

        <button class="account-btn secondary"
        onclick="openChat()">
            ⬅ Rudi kwenye chat
        </button>

        <button class="account-btn secondary"
        onclick="logout()">
            🚪 Logout
        </button>
    </div>
</section>

<script>
function showScreen(id){
    document.querySelectorAll('.screen')
    .forEach(s=>s.classList.remove('active'));

    document.getElementById(id)
    .classList.add('active');
}

function login(){
    let username =
    document.getElementById('username').value;

    let password =
    document.getElementById('password').value;

    if(!username || !password){
        alert("Jaza taarifa zote");
        return;
    }

    localStorage.setItem(
        'username',
        username
    );

    document.getElementById(
        'accountName'
    ).innerText=username;

    showScreen('chatScreen');
}

function openAccount(){
    showScreen('accountScreen');
}

function openChat(){
    showScreen('chatScreen');
}

function logout(){
    localStorage.clear();
    showScreen('loginScreen');
}

function sendMessage(){
    let input=
    document.getElementById('userInput');

    let text=input.value.trim();

    if(!text)return;

    let chat=
    document.getElementById('chatArea');

    chat.innerHTML += `
    <div class="message user">
        <div class="bubble">${text}</div>
    </div>
    `;

    input.value='';

    setTimeout(()=>{
        chat.innerHTML += `
        <div class="message ai">
            <div class="bubble">
                Umesema:
                ${text}
            </div>
        </div>
        `;

        chat.scrollTop=
        chat.scrollHeight;
    },700);
}

function changePassword(){
    let pass=
    document.getElementById(
        'newPassword'
    ).value;

    if(!pass){
        alert("Weka password mpya");
        return;
    }

    alert(
        "Password imebadilishwa"
    );

    document.getElementById(
        'newPassword'
    ).value='';
}

function shareChat(){
    let chatText=
    document.getElementById(
        'chatArea'
    ).innerText;

    let blob=
    new Blob([chatText],
    {type:'text/plain'});

    let a=
    document.createElement('a');

    a.href=
    URL.createObjectURL(blob);

    a.download=
    'maisha_chat.txt';

    a.click();
}

document.addEventListener(
'DOMContentLoaded',()=>{

    let username=
    localStorage.getItem(
        'username'
    );

    if(username){
        document.getElementById(
        'accountName'
        ).innerText=username;

        showScreen(
        'chatScreen');
    }
});
</script>

</body>
</html>
