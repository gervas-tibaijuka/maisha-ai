<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>Maisha AI v2</title>

<style>
:root{
    --bg:#0d0f12;
    --panel:#111318;
    --surface:#1a1d24;
    --border:rgba(255,255,255,0.08);
    --text:#e8eaf0;
    --muted:#8b90a0;
    --accent:#4f8ef7;
    --user:#1d4ed8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}

body{
    display:flex;
    height:100vh;
    background:var(--bg);
    color:var(--text);
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:var(--panel);
    padding:15px;
    display:flex;
    flex-direction:column;
}

.newchat{
    padding:10px;
    background:var(--accent);
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:10px;
}

.chat-list{
    flex:1;
    overflow:auto;
}

.chat-item{
    padding:10px;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    color:var(--muted);
}
.chat-item:hover{
    background:var(--surface);
    color:white;
}

/* MAIN */
.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:50px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 15px;
}

/* CHAT */
.chat{
    flex:1;
    overflow:auto;
    padding:20px;
}

.msg{
    max-width:70%;
    margin-bottom:12px;
    padding:10px 14px;
    border-radius:10px;
    line-height:1.5;
    font-size:14px;
}

.user{
    background:var(--user);
    margin-left:auto;
}

.ai{
    background:var(--surface);
}

/* INPUT */
.inputbox{
    display:flex;
    padding:10px;
    border-top:1px solid var(--border);
}

input{
    flex:1;
    padding:12px;
    border:none;
    outline:none;
    border-radius:8px;
    background:var(--surface);
    color:white;
}

button{
    margin-left:10px;
    padding:12px 16px;
    border:none;
    background:var(--accent);
    color:white;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <button class="newchat" onclick="newChat()">+ New Chat</button>
    <div id="chatList" class="chat-list"></div>
</div>

<!-- MAIN -->
<div class="main">

<div class="topbar">
    <b>Maisha AI</b>
</div>

<div id="chat" class="chat"></div>

<div class="inputbox">
    <input id="text" placeholder="Andika ujumbe..." />
    <button onclick="send()">Send</button>
</div>

</div>

<script>

let currentChatId = null;

// LOAD chats
async function loadChats(){
    let res = await fetch('/api/chats');
    let data = await res.json();

    let list = document.getElementById('chatList');
    list.innerHTML = '';

    data.chats.forEach(c=>{
        let div = document.createElement('div');
        div.className='chat-item';
        div.innerText = c.title;
        div.onclick = ()=>openChat(c.id);
        list.appendChild(div);
    });
}

// OPEN chat
async function openChat(id){
    currentChatId = id;

    let res = await fetch('/api/chat/'+id);
    let data = await res.json();

    let chat = document.getElementById('chat');
    chat.innerHTML='';

    data.messages.forEach(m=>{
        let div = document.createElement('div');
        div.className='msg '+(m.sender=='user'?'user':'ai');
        div.innerText = m.message;
        chat.appendChild(div);
    });
}

// NEW chat
async function newChat(){
    let res = await fetch('/api/chat/new');
    let data = await res.json();
    currentChatId = data.id;
    loadChats();
    document.getElementById('chat').innerHTML='';
}

// SEND message
async function send(){
    let text = document.getElementById('text').value;
    if(!text) return;

    let chat = document.getElementById('chat');

    // user msg
    chat.innerHTML += `<div class='msg user'>${text}</div>`;

    document.getElementById('text').value='';

    let res = await fetch('/api/chat/send',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            chat_id:currentChatId,
            message:text
        })
    });

    let data = await res.json();

    chat.innerHTML += `<div class='msg ai'>${data.response}</div>`;
}

// init
loadChats();

</script>

</body>
</html>
